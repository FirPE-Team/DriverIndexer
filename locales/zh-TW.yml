console:
  info: "資訊"
  success: "成功"
  warning: "警告"
  err: "錯誤"
  debug: "偵錯"

cmdline_tool_tips: "這是一個命令列工具，你需要從 cmd.exe 中執行."
temp-create-failed: "暫存目錄建立失敗"
