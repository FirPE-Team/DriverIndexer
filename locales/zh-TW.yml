# 模板
template: "{bin} V{version}\n\n 用法: {bin}.exe [選項] [命令] [參數]\n\n 命令:\n {subcommands}\n\n 選項:\n {options}"

# 命令
commands:
  # 建立索引
  index: "建立驅動索引。索引格式：JSON"
  info: "輸出驅動索引資訊"
  install: "安裝驅動。自動匹配壓縮包中的驅動程式並安裝"
  eject: "彈出免驅動裝置虛擬光碟機以辨識真實USB裝置"
  install-offline: "載入硬碟中離線系統內的驅動"
  list: "列舉驅動程式。支援線上系統、離線系統"
  import: "匯入驅動程式。支援線上系統、離線系統"
  export: "匯出驅動程式。支援線上系統、離線系統"
  remove: "刪除驅動程式。支援線上系統、離線系統"
  organize: "整理驅動程式"
  pack: "建立驅動程式包"
  scan: "掃描新硬體"
  encrypt: "加密的平文密碼"
  help: "列印說明資訊。顯示此資訊或指定命令說明"
# 選項
options:
  lang: "設定程式語言"
  save-index-path: "索引檔案儲存位置"
  package-path: "壓縮包路徑"
  index-path: "索引檔案路徑"
  package-password: "設定壓縮包密碼"
  match-all-device: "匹配所有裝置"
  missing-only: "僅安裝缺失的驅動"
  driver-category: "驅動類別"
  extract_to: "僅解壓縮驅動程式而不安裝"
  force: "強制安裝驅動程式"
  rename: "重新命名驅動目錄"
  system-drive: "系統碟路徑"
  export-path: "匯出驅動程式路徑"
  driver-name: "驅動程式名稱(inf)"
  driver-provider: "驅動程式供應商"
  debug: "開啟偵錯模式"
  encrypt-password: "加密的平文密碼"
  log-path: "日誌檔案路徑"
  help: "列印說明資訊"
  version: "列印版本資訊"
value-parser:
  path-not-exist: "路徑不存在"
  dir-not-exist: "目錄不存在"
  file-not-exist: "檔案不存在"
  not-system-path: "不是系統路徑"
  not-dir: "路徑不是目錄"

# 建立索引
create-index-info: "正在建立驅動索引......"
no-hardware: "未偵測到硬體資訊"
inf-parse-error: "INF解析錯誤"
index-save-failed: "索引檔案儲存失敗"
no-inf-find: "沒有找到驅動資訊"
total-info: "共處理 %{total} 個驅動，成功 %{success} 個驅動，失敗 %{error} 個驅動，未偵測到硬體資訊 %{blank} 個驅動"
save-info: "驅動索引儲存在 %{path}"
create-index-failed: "建立索引失敗"

# 載入驅動
driver-install-info: "安裝驅動"
load-index: "載入索引"
no-device: "取得硬體資訊失敗"
