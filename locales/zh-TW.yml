# 匯入驅動
offline-Arch-Err: "取得離線系統架構失敗"
driver-import-info: "匯入驅動"
driver-import-success: "匯入驅動成功"
driver-import-failed: "匯入驅動失敗"
driver-import-summary: "共處理 %{total} 個驅動，成功 %{success}，失敗 %{fail}"

# 匯出驅動
driver-export-success: "檔案: %{file}\n            類別: %{class}\n            版本: %{version}\n            日期: %{date}"
driver-export-failed: "匯出驅動失敗"
driver-export-not-found: "沒有找到符合條件的驅動"
