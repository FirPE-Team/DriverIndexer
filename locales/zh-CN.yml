# 导出驱动
driver-export-success: "文件: %{file}\n            类别: %{class}\n            版本: %{version}\n            日期: %{date}"
driver-export-failed: "导出驱动失败"
driver-export-not-found: "没有找到符合条件的驱动"
driver-export-summary: "共处理 %{total} 个驱动，成功 %{success}，失败 %{fail}"

# 删除驱动
driver-remove-info: "删除驱动"
driver-remove-success: "删除驱动成功"
driver-remove-failed: "删除驱动失败"
driver-remove-not-found: "没有找到符合条件的驱动"
driver-remove-summary: "共处理 %{total} 个驱动，成功 %{success}，失败 %{fail}"

# 扫描设备
scan-devices-success: "扫描设备完成"
scan-devices-failed: "扫描设备失败"

# 弹出免驱设备虚拟光驱
ejecting-virtual-drive: "弹出免驱设备虚拟光驱 (%{drive})"
not-found-virtual-drive: "没有找到免驱设备虚拟光驱"

# 整理驱动
organize-driver-success: "整理驱动完成"
