driver-unzip-failed: "驱动程序解压失败"
driver-unzip-success: "驱动程序解压成功"
driver-install-failed: "驱动程序安装失败"
driver-install-success: "驱动程序安装成功"

# 加载离线驱动
loading-offline-driver: "加载离线系统驱动 (%{path})"
