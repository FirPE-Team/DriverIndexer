# 模板
template: "{bin} V{version}\n\n 用法: {bin}.exe [选项] [命令] [参数]\n\n 命令:\n {subcommands}\n\n 选项:\n {options}"

# 命令
commands:
  # 创建索引
  index: "创建驱动索引。索引格式：JSON"
  info: "输出驱动索引信息"
  install: "安装驱动程序。自动匹配压缩包中的驱动程序并安装"
  eject: "弹出免驱设备虚拟光驱以识别真实USB设备"
  install-offline: "安装硬盘中离线系统内的驱动程序"
  list: "列举驱动程序。支持在线系统、离线系统"
  import: "导入驱动程序。支持在线系统、离线系统"
  export: "导出驱动程序。支持在线系统、离线系统"
  remove: "删除驱动程序。支持在线系统、离线系统"
  organize: "整理驱动程序"
  pack: "创建驱动程序包"
  scan: "扫描新硬件"
  encrypt: "加密密码字符串，生成可用于 -p 参数的安全密文"
  help: "打印帮助信息。显示此信息或指定命令帮助"
# 选项
options:
  lang: "设置程序语言"
  save-index-path: "索引文件保存位置"
  package-path: "压缩包路径"
  index-path: "索引文件路径"
  package-password: "设置压缩包密码"
  match-all-device: "匹配所有设备"
  missing-only: "仅安装缺失的驱动"
  driver-category: "指定驱动类别"
  exclude-category: "排除指定的驱动类别"
  extract_to: "仅解压驱动程序而不安装"
  force: "强制安装驱动程序"
  rename: "重命名驱动目录"
  system-drive: "系统盘路径"
  export-path: "导出驱动程序路径"
  driver-name: "驱动程序名称(inf)"
  driver-provider: "驱动程序供应商"
  encrypt-password: "要加密的明文密码"
  debug: "开启调试模式"
  log-path: "日志文件路径"
  help: "打印帮助信息"
  version: "打印版本信息"
value-parser:
  path-not-exist: "路径不存在"
  dir-not-exist: "目录不存在"
  file-not-exist: "文件不存在"
  not-system-path: "不是系统路径"
  not-dir: "路径不是目录"

# 创建索引
