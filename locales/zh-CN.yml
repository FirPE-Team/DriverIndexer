console:
  info: "信息"
  success: "成功"
  warning: "警告"
  err: "错误"
  debug: "调试"

cmdline_tool_tips: "本程序是一个命令行工具，请在终端（如 cmd.exe, PowerShell）中运行。"
temp-create-failed: "临时目录创建失败"
